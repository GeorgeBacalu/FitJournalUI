<div class="auth-shell">
  <p-card class="auth-panel">
    <div class="flex flex-column align-items-center text-center gap-3 mb-4">
      <img alt="FitJournal logo" class="logo-mark" src="/fit-journal-logo.ico" />
      <div>
        <h1 class="page-title">Welcome back</h1>
        <p class="page-subtitle">
          Sign in to continue managing your workouts, goals, progress and nutrition logs.
        </p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input id="email" pInputText formControlName="email" class="w-full" />
        @if (hasError(form.controls.email)) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        @if (hasError(form.controls.password)) {
          <small class="field-error">Password is required.</small>
        }
      </div>

      <button pButton type="submit" label="Login" icon="pi pi-sign-in" [loading]="submitting"></button>
    </form>

    <div class="flex flex-column md:flex-row md:justify-content-between gap-2 mt-4">
      <a routerLink="/forgot-password" class="font-medium text-primary">Forgot your password?</a>
      <a routerLink="/register" class="font-medium text-primary">Create a new account</a>
    </div>
  </p-card>
</div>
