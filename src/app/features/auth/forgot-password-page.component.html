<div class="auth-shell">
  <p-card class="auth-panel">
    <div class="flex flex-column align-items-center text-center gap-3 mb-4">
      <img alt="FitJournal logo" class="logo-mark" src="/fit-journal-logo.ico" />
      <div>
        <h1 class="page-title">Forgot password</h1>
        <p class="page-subtitle">
          Enter your email and the backend will send you the reset instructions.
        </p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input id="email" pInputText formControlName="email" class="w-full" />
        @if (hasError(form.controls.email)) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </div>

      <button
        pButton
        type="submit"
        label="Send reset email"
        icon="pi pi-envelope"
        [loading]="submitting"
      ></button>
    </form>

    <div class="mt-4 text-center">
      <a routerLink="/login" class="font-medium text-primary">Back to login</a>
    </div>
  </p-card>
</div>
