<div class="auth-shell">
  <p-card class="auth-panel">
    <div class="flex flex-column align-items-center text-center gap-3 mb-4">
      <img alt="FitJournal logo" class="logo-mark" src="/fit-journal-logo.ico" />
      <div>
        <h1 class="page-title">Reset password</h1>
        <p class="page-subtitle">
          Paste the reset token you received, then choose a new password.
        </p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <div class="field">
        <label class="field-label" for="token">Reset token</label>
        <input id="token" pInputText formControlName="token" class="w-full" />
        @if (hasError(form.controls.token)) {
          <small class="field-error">The reset token is required.</small>
        }
      </div>

      <div class="field">
        <label class="field-label" for="newPassword">New password</label>
        <p-password
          inputId="newPassword"
          formControlName="newPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <div class="field">
        <label class="field-label" for="confirmedPassword">Confirm new password</label>
        <p-password
          inputId="confirmedPassword"
          formControlName="confirmedPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        @if (hasError(form.controls.confirmedPassword) || passwordsMismatch()) {
          <small class="field-error">Passwords must match.</small>
        }
      </div>

      <button
        pButton
        type="submit"
        label="Update password"
        icon="pi pi-lock"
        [loading]="submitting"
      ></button>
    </form>

    <div class="mt-4 text-center">
      <a routerLink="/login" class="font-medium text-primary">Back to login</a>
    </div>
  </p-card>
</div>
